pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    architecture:
      glob: "src/**/*.{ts,tsx}"
      run: bun run arch:lint
